<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#153d30"><title>Pasaporte de la Biodiversidad · Semana por la Vida</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#163d30;background:#f8f6eb}*{box-sizing:border-box}body{margin:0}header{background:#153d30;color:#fff9dc;padding:18px 15px;text-align:center}header h1{font-size:clamp(22px,5vw,35px);margin:0}header p{margin:5px;color:#dbe7ba;letter-spacing:2px;font-weight:700}main{max-width:780px;margin:auto;padding:18px 14px 80px}.card{background:white;border:1px solid #d9e4d0;border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 4px 18px #173c3020}h2{margin:0 0 12px;font-size:23px}h3{margin:12px 0}p{line-height:1.55}.muted{color:#52685c}.progress{height:12px;background:#dbe7d8;border-radius:15px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:#b48c32;transition:width .3s}button{border:0;border-radius:12px;background:#1d6248;color:white;padding:13px 17px;font-weight:750;font-size:15px;cursor:pointer}button:disabled{background:#b8c4ba;cursor:not-allowed}button.secondary{background:#e9f0e5;color:#153d30}button.option{display:block;width:100%;text-align:left;margin:8px 0;background:#f0f5ed;color:#163d30;border:2px solid transparent}button.option.selected{border-color:#1d6248;background:#dcecd9}button.option.wrong{border-color:#b64d42;background:#fff0ee}button.option.correct{border-color:#2e8655;background:#e1f4e3}input[type=text]{width:100%;padding:14px;border:1px solid #b8c9b9;border-radius:10px;font-size:16px;margin:6px 0 16px}label{font-weight:700}.notice{background:#f0f4e6;border-radius:12px;padding:12px;margin:12px 0}.sealrow{display:flex;gap:7px;justify-content:space-between}.seal{flex:1;min-width:0;text-align:center;border-radius:12px;background:#e6eae1;padding:10px 3px;filter:grayscale(1);opacity:.5}.seal.earned{filter:none;opacity:1;background:#e8f2df;border:2px solid #bba052}.seal .emoji{font-size:28px}.seal small{display:block;font-size:10px}.art{width:100%;display:block;border-radius:12px}.hotspotwrap{position:relative}.hotspot{position:absolute;border:3px solid transparent;border-radius:50%;background:transparent;padding:0;transform:translate(-50%,-50%);min-width:40px;min-height:40px}.hotspot.found{border:4px solid #ffcc3c;background:#ffde3a55;box-shadow:0 0 0 3px #194f39}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{background:#f1f5eb;border:2px solid #e2e9dd;border-radius:12px;padding:8px;text-align:center;cursor:pointer;color:#153d30}.tile.selected{border-color:#2c8055;background:#dcefdc}.tile img{width:100%;aspect-ratio:1.7;object-fit:cover;border-radius:8px}.tile .symbol{font-size:46px;display:block;padding:17px}.tile strong{font-size:13px;display:block}.order{display:flex;gap:8px;align-items:center;background:#f0f5ec;padding:9px;border-radius:10px;margin:7px 0}.order span{flex:1;font-weight:650}.order button{padding:8px 12px}.stamp{font-size:70px;text-align:center}.center{text-align:center}.hidden{display:none!important}.diploma{border:8px double #b69748;background:#fffdf1;padding:22px;text-align:center}.diploma h2{font-family:Georgia,serif;font-size:29px}.diploma .sealrow{margin:18px 0}.diploma p{text-align:left}.diploma .meta{text-align:center;font-size:18px}.footer{text-align:center;color:#55715c;font-size:12px;margin-top:30px}@media print{header,.noprint,.progress,.footer{display:none!important}body{background:white}main{padding:0;max-width:none}.card{box-shadow:none;border:0;margin:0;padding:0}.diploma{min-height:90vh;page-break-inside:avoid}#stage{display:block!important}}html[data-js="activo"] #loadStatus{color:#1d6248}</style></head><body><script>document.documentElement.setAttribute("data-js","activo")</script><header><h1>🌿 PASAPORTE DE LA BIODIVERSIDAD</h1><p>SEMANA POR LA VIDA</p></header><main id="app"><div class="card" id="initial"><h2>Bienvenido a la aventura</h2><p>Recorre seis estaciones, aprende sobre la biodiversidad de Colombia y colecciona cinco sellos.</p><label for="name">Nombre completo</label><input id="name" type="text" maxlength="100" placeholder="Escribe tu nombre"><label for="company">Empresa</label><input id="company" type="text" maxlength="120" placeholder="Empresa donde trabajas"><p class="muted">Tu progreso se guarda en este navegador cuando está permitido.</p><button type="button" id="startFallback">Comenzar aventura →</button><p id="loadStatus" class="muted">Iniciando versión 8…</p></div></main><noscript><p style="padding:15px">Activa JavaScript en Chrome para jugar.</p></noscript><script>
/* Versión 8: diagnóstico de arranque y recuperación de progreso */


const Q=[["¿En cuál de estos ecosistemas colombianos son característicos los frailejones?", ["Manglar", "Páramo", "Arrecife coralino", "Bosque seco"], 1], ["¿Qué función cumplen los manglares en las costas colombianas?", ["Aumentan la erosión", "Protegen la costa del oleaje", "Impiden la vida de peces", "Eliminan las mareas"], 1], ["¿Cuál de estos animales es un mamífero?", ["Rana", "Garza", "Manatí", "Iguana"], 2], ["¿Qué pueden hacer los murciélagos que se alimentan de frutos?", ["Dispersar semillas", "Producir néctar", "Formar arrecifes", "Absorber agua del suelo"], 0], ["¿En qué región natural se encuentra el Parque Nacional Natural Serranía de Chiribiquete?", ["Amazonía", "Caribe", "Pacífico", "Insular"], 0], ["¿Qué significa que una especie sea endémica de Colombia?", ["Que fue traída de otro continente", "Que solo vive en ciudades", "Que su distribución natural está restringida a Colombia", "Que habita todos los países"], 2], ["¿Cuál de estas acciones ayuda a proteger a la fauna silvestre en una carretera?", ["Acelerar al verla", "Reducir la velocidad y mantener la atención", "Alimentarla desde el vehículo", "Acercarse para tomar una foto"], 1], ["¿Qué proceso ocurre cuando un ave lleva polen de una flor a otra?", ["Germinación", "Polinización", "Erosión", "Evaporación"], 1], ["¿Cuál de estos ecosistemas ofrece refugio a muchas especies acuáticas jóvenes?", ["Manglar", "Glaciar", "Desierto de dunas", "Zona pavimentada"], 0], ["Si encuentra un animal silvestre aparentemente herido, ¿cuál es la mejor primera acción?", ["Llevarlo a casa", "Darle cualquier alimento", "Mantener distancia y avisar a la autoridad ambiental competente", "Publicar su ubicación para que otras personas lo visiten"], 2]], STEPS=["Detenga la actividad", "Acordone y demarque", "Avise al ambiental de campo", "Espere la ayuda", "Reanude con autorización"], COMMIT="Me comprometo a respetar la fauna y la flora silvestres en cada lugar donde realice mis actividades. Mantendré una distancia segura de los animales, no los alimentaré ni manipularé y cuidaré sus hábitats.\n\nAntes de intervenir un área, estaré atento a la presencia de seres vivos. Si encuentro un animal silvestre, detendré la actividad en el punto, protegeré el lugar y avisaré al ambiental de campo para que se active la atención correspondiente.\n\nCada acción cuenta. Hoy me comprometo a proteger la vida en todas sus formas.";
const sealIcons=['🐒','🐆','🌸','🦭','🔭'];const sealNames=['Mono cariblanco','Jaguar','Orquídea','Manatí','Binoculares'];
const titles=['Encuentra las especies','Trivia de biodiversidad','¿De quién es la huella?','Encuentro con fauna','Equipos de monitoreo','Mi compromiso con la biodiversidad'];
const laminas=[{file:'fauna.jpg',animals:[{x:10,y:30,w:8,h:24},{x:27,y:25,w:13,h:22},{x:87,y:26,w:17,h:35},{x:37,y:64,w:16,h:29},{x:79,y:66,w:14,h:30}]}];
const footprint=['Perro doméstico','Puma','Zarigüeya','Zorro perro','Tayra','Yaguarundí','Oso perezoso','Ser humano'];
const equip=[['Binoculares','🔭',true],['Cámara trampa','📷',true],['GPS','🛰️',true],['Grabadora acústica','🎙️',true],['Cámara fotográfica','📸',true],['Libreta de campo','📓',true],['Control remoto','📺',false],['Taza','☕',false],['Secador de pelo','💨',false],['Balón','⚽',false]];
const fresh=()=>({name:'',company:'',date:'',completed:0,stage:0,found:[],lamina:null,answers:{},foot:{},selectedEquip:[],order:[2,4,0,3,1],accepted:false});
let state=fresh();try{const old=JSON.parse(localStorage.getItem('bioPassportV1')||'{}');if(old&&typeof old==='object')state={...state,...old};if(!Array.isArray(state.found)||!Array.isArray(state.order)||!Array.isArray(state.selectedEquip)||!state.answers||!state.foot)state=fresh()}catch(e){state=fresh()}
const save=()=>{try{localStorage.setItem('bioPassportV1',JSON.stringify(state))}catch(e){/* Android content:// may block storage; game remains usable */}};
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function top(){let done=state.completed;return `<div class="sealrow">${sealIcons.map((e,i)=>`<div class="seal ${i<done?'earned':''}"><div class="emoji">${i<done?e:'🔒'}</div><small>${i<done?sealNames[i]:'Est. '+(i+1)}</small></div>`).join('')}</div><div class="progress"><span style="width:${done*20}%"></span></div><div class="muted center">${done} de 5 sellos obtenidos</div>`}
function render(){let h='';if(!state.name){h=`<div class="card"><h2>Bienvenido a la aventura</h2><p>Recorre seis estaciones, aprende sobre la biodiversidad de Colombia y colecciona cinco sellos.</p><label for="name">Nombre completo</label><input id="name" type="text" maxlength="100" autocomplete="name" placeholder="Escribe tu nombre"><label for="company">Empresa</label><input id="company" type="text" maxlength="120" placeholder="Empresa donde trabajas"><p class="muted">Tu progreso se guarda en este navegador cuando está permitido.</p><button onclick="register()">Comenzar aventura →</button></div>`}else{h=`<div class="card noprint"><div class="muted">Participante: <strong>${esc(state.name)}</strong> · ${esc(state.company)}</div>${top()}</div><div id="stage" class="card"><div class="muted">ESTACIÓN ${state.stage+1} DE 6</div><h2>${titles[state.stage]}</h2>${stageHtml()}</div><div class="footer noprint">SEMANA POR LA VIDA · Pasaporte de la Biodiversidad</div>`} $('app').innerHTML=h}
function register(){let n=$('name').value.trim(),c=$('company').value.trim();if(!n||!c){alert('Escribe tu nombre y tu empresa.');return}state.name=n;state.company=c;state.lamina=0;state.date=new Date().toLocaleDateString('es-CO',{day:'2-digit',month:'long',year:'numeric'});save();render()}
function stageHtml(){switch(state.stage){case 0:{const lam=laminas[state.lamina??0];return `<p>Busca y toca los cinco animales escondidos. <strong>En esta versión aparece una sola lámina.</strong> Cada hallazgo quedará señalado con un círculo.</p><div class="hotspotwrap"><img class="art" src="${lam.file}" alt="Lámina aleatoria de fauna de la estación 1">${lam.animals.map((t,i)=>`<button aria-label="Encontrar animal ${i+1}" class="hotspot ${state.found.includes(i)?'found':''}" style="left:${t.x}%;top:${t.y}%;width:${t.w}%;height:${t.h}%" onclick="findAnimal(${i})"></button>`).join('')}</div><div class="notice">Encontrados: ${state.found.length}/5 · ${state.found.length===5?'¡Todos los animales identificados!':'Observa con atención las ramas y el follaje.'}</div><button ${state.found.length===5?'':'disabled'} onclick="complete()">Conseguir sello 🐒</button>`;}
case 1:{let idx=Q.findIndex((q,i)=>state.answers[i]!==q[2]);if(idx===-1)return `<div class="notice">¡Las diez respuestas son correctas!</div><button onclick="complete()">Conseguir sello 🐆</button>`;let q=Q[idx];return `<p>Pregunta ${idx+1} de ${Q.length}. Selecciona la respuesta correcta para avanzar.</p><div class="progress"><span style="width:${idx*10}%"></span></div><h3>${esc(q[0])}</h3>${q[1].map((a,i)=>`<button class="option" onclick="answerTrivia(${idx},${i})">${'ABCD'[i]}. ${esc(a)}</button>`).join('')}<p class="muted">Puedes intentarlo nuevamente si te equivocas.</p>`}
case 2:{let idx=Array.from({length:8},(_,i)=>i).find(i=>state.foot[i]!==footprint[i]);if(idx===undefined)return `<div class="notice">¡Identificaste correctamente las ocho huellas!</div><button onclick="complete()">Conseguir sello 🌸</button>`;return `<p>Identifica a qué animal pertenece cada huella (A–H).</p><img class="art" src="huellas.jpg" alt="Lámina de ocho huellas identificadas con letras A a H"><h3>Huella ${'ABCDEFGH'[idx]} · ${idx+1} de 8</h3><div class="grid">${footprint.map((n,i)=>`<button class="option" onclick="answerFoot(${idx},${i})">${esc(n)}</button>`).join('')}</div><p class="muted">Las respuestas correctas se conservarán durante el recorrido.</p>`}
case 3:return `<p>Ordena los cinco pasos para actuar ante un encuentro con fauna silvestre. Usa las flechas para mover cada acción.</p>${state.order.map((id,i)=>`<div class="order"><strong>${i+1}.</strong><span>${STEPS[id]}</span><button class="secondary" aria-label="Subir paso" ${i===0?'disabled':''} onclick="move(${i},-1)">↑</button><button class="secondary" aria-label="Bajar paso" ${i===4?'disabled':''} onclick="move(${i},1)">↓</button></div>`).join('')}<button onclick="checkOrder()">Comprobar secuencia</button>`;
case 4:return `<p>Selecciona únicamente los seis elementos que se utilizan para el monitoreo de fauna. Hay cuatro distractores.</p><div class="grid">${equip.map((e,i)=>`<button class="tile ${state.selectedEquip.includes(i)?'selected':''}" onclick="toggleEquip(${i})">${e[1].endsWith('.jpg')?`<img src="${e[1]}" alt="${e[0]}">`:`<span class="symbol">${e[1]}</span>`}<strong>${e[0]}</strong></button>`).join('')}</div><div class="notice">Seleccionados: ${state.selectedEquip.length}/6</div><button onclick="checkEquip()">Comprobar selección</button>`;
case 5:return `<div class="diploma" id="diploma"><div style="font-size:33px">🌿 🏆 🌿</div><h2>Pasaporte de la Biodiversidad</h2><h3>Compromiso con la biodiversidad</h3><p class="meta"><strong>${esc(state.name)}</strong><br>${esc(state.company)}<br>${esc(state.date)}</p>${COMMIT.split('\n\n').map(t=>`<p>${esc(t)}</p>`).join('')}<div class="sealrow">${sealIcons.map((e,i)=>`<div class="seal earned"><div class="emoji">${e}</div><small>${sealNames[i]}</small></div>`).join('')}</div><p class="center"><strong>SEMANA POR LA VIDA</strong></p><div class="noprint"><label style="font-weight:normal"><input type="checkbox" id="accept" ${state.accepted?'checked':''} onchange="acceptCommit(this.checked)"> Acepto y suscribo este compromiso ambiental</label></div><div id="signature" class="${state.accepted?'':'hidden'}"><p class="center">Firma digital de aceptación: <strong>${esc(state.name)}</strong></p><p class="center">🏆 ¡Felicitaciones! Completaste el pasaporte de la biodiversidad.</p></div></div><div class="noprint" style="margin-top:14px"><button ${state.accepted?'':'disabled'} onclick="window.print()">Imprimir / guardar diploma en PDF</button><p class="muted">En el celular, selecciona “Guardar como PDF” en el menú de impresión.</p></div>`}
}
function findAnimal(i){if(!state.found.includes(i)){state.found.push(i);save();render()}}
function answerTrivia(i,a){if(a===Q[i][2]){state.answers[i]=a;save();render()}else{alert('Esa no es la respuesta correcta. Inténtalo de nuevo.')}}
function answerFoot(i,a){if(a===i){state.foot[i]=footprint[i];save();render()}else alert('Esa huella corresponde a otro animal. Vuelve a intentarlo.')}
function move(i,delta){let j=i+delta;[state.order[i],state.order[j]]=[state.order[j],state.order[i]];save();render()}
function checkOrder(){if(state.order.every((x,i)=>x===i))complete();else alert('La secuencia todavía no es correcta. Revisa el orden y vuelve a intentar.')}
function toggleEquip(i){let at=state.selectedEquip.indexOf(i);if(at>=0)state.selectedEquip.splice(at,1);else state.selectedEquip.push(i);save();render()}
function checkEquip(){if(state.selectedEquip.length===6&&state.selectedEquip.every(i=>equip[i][2]))complete();else alert('Revisa la selección: debes identificar los seis equipos de monitoreo, sin distractores.')}
function complete(){if(state.stage>4)return;state.completed=Math.max(state.completed,state.stage+1);const s=sealIcons[state.stage],n=sealNames[state.stage];state.stage++;save();render();alert(`¡Sello conseguido! ${s} ${n}. Has desbloqueado la siguiente estación.`)}
function acceptCommit(yes){state.accepted=yes;save();render()}
try{document.getElementById('startFallback').addEventListener('click',register);render();}catch(e){const status=document.getElementById('loadStatus');if(status)status.textContent='Error al iniciar: '+e.message;console.error(e)}
window.addEventListener('error',function(e){const status=document.getElementById('loadStatus');if(status)status.textContent='Error: '+e.message;});

</script></body></html>

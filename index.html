<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pasaporte de la Biodiversidad</title><style>:root{--green:#173d31;--gold:#e6a23c;--cream:#faf7ec}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--green);font:17px system-ui,Arial}header{background:var(--green);color:#fff8df;padding:23px 18px;text-align:center}header h1{font-size:clamp(23px,5vw,36px);margin:0}header p{letter-spacing:3px;margin:9px 0 0;color:#dce8b7}main{max-width:760px;margin:25px auto;padding:0 15px 50px}.card{background:white;border:1px solid #d7e2cc;border-radius:22px;padding:22px;box-shadow:0 5px 22px #173d3112}h2{margin:0 0 16px;font-size:27px}h3{margin:14px 0 9px}p{line-height:1.55}input,button{font:inherit}input{padding:13px;border:1px solid #b6c4b2;border-radius:12px;width:100%;margin:6px 0 14px}button{background:#21634c;color:white;border:0;border-radius:12px;padding:13px 19px;font-weight:700;cursor:pointer;margin:6px 5px 6px 0}button:disabled{opacity:.4}button.secondary{background:#f0f5ea;color:#173d31;border:1px solid #c9d8c4}.choice{display:block;width:100%;text-align:left;background:#edf3e9;color:#173d31;margin:7px 0;font-weight:500}.choice.selected{background:#d6eabf;outline:2px solid #548e56}.badge{background:#f6e6b9;border-radius:50%;padding:8px;display:inline-block}.scene{position:relative;width:100%;aspect-ratio:3/2;background:url('bosque.jpg') center/cover;border-radius:15px;overflow:hidden}.target{position:absolute;background:transparent;border:2px solid transparent;width:17%;height:25%;padding:0;margin:0;border-radius:50%}.target.found{border:3px solid #f5cd55;background:#f5cd5544}.targets{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.pill{padding:8px 12px;background:#edf3e9;border-radius:20px}.pill.done{background:#c9e6c5}.question{border:1px solid #d9e2d0;border-radius:12px;padding:13px;margin:13px 0}.step{padding:13px;border:1px solid #d9e2d0;border-radius:12px;margin:8px 0;background:#fff}.step button{padding:5px 12px;font-size:14px}.equipment{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.equip{border:2px solid #d5dfcf;border-radius:14px;padding:9px;text-align:center;background:#fff;color:var(--green);margin:0}.equip img{width:100%;height:110px;object-fit:cover;border-radius:8px}.equip.on{border-color:#1d7c52;background:#e4f4e2}.footprints{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.foot{background:#f0e5d2;border:1px solid #cfb894;border-radius:12px;text-align:center;padding:10px 3px}.foot svg{width:100%;max-width:130px;height:130px}.seal{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;border:3px double #b58a34;border-radius:50%;height:100px;width:100px;margin:5px;background:#fdf4dc;font-size:29px}.seal small{font-size:11px}.certificate{border:7px double #b58a34;background:linear-gradient(#fffdf3,#f1f8e8);padding:20px;text-align:center}.certificate h2{font-family:Georgia,serif}.certificate .seals{display:flex;flex-wrap:wrap;justify-content:center}.notice{background:#e9f3df;border-radius:12px;padding:12px;margin:14px 0}.error{color:#a22}.muted{color:#66756c;font-size:14px}#status{min-height:20px}@media print{header,.no-print,button{display:none!important}main{margin:0;max-width:none}.card{border:0;box-shadow:none}.certificate{min-height:90vh}}@media(max-width:400px){.footprints{grid-template-columns:1fr 1fr}.card{padding:15px}}</style></head><body><header><h1>🌿 PASAPORTE DE LA BIODIVERSIDAD</h1><p>SEMANA POR LA VIDA</p></header><main><div id="app" class="card"></div></main><script>
'use strict';
// Para activar el registro centralizado, pegar aquí la URL /exec del despliegue de Apps Script.
const REGISTRO_URL='';
const app=document.getElementById('app');let stage=0,name='',company='',date='',found=new Set(),answers={},order=[2,4,1,5,3],selectedEquip=new Set(),footAnswers={};
const q=[['¿En cuál de estos ecosistemas colombianos son característicos los frailejones?',['Manglar','Páramo','Arrecife coralino','Bosque seco'],1],['¿Qué función cumplen los manglares en las costas colombianas?',['Aumentan la erosión','Protegen la costa del oleaje','Impiden la vida de peces','Eliminan las mareas'],1],['¿Cuál de estos animales es un mamífero?',['Rana','Garza','Manatí','Iguana'],2],['¿Qué pueden hacer los murciélagos que se alimentan de frutos?',['Dispersar semillas','Producir néctar','Formar arrecifes','Absorber agua del suelo'],0],['¿En qué región natural se encuentra el Parque Nacional Natural Serranía de Chiribiquete?',['Amazonía','Caribe','Pacífico','Insular'],0]];
const steps=[['DETENGA LA ACTIVIDAD','Suspenda las labores en el punto del hallazgo. Mantenga la distancia y deje una vía de salida para el animal.'],['ACORDONE Y DEMARQUE','Señalice el área sin acercarse. Evite el ingreso de otras personas y espere en un lugar seguro.'],['AVISE AL AMBIENTAL DE CAMPO','Informe la ubicación y el estado aparente del animal. El ambiental contactará al equipo biótico o, en su defecto, a la Policía Ambiental o a los Bomberos.'],['ESPERE LA AYUDA','Observe desde lejos. No lo toque, capture, persiga, alimente ni traslade. No le arroje objetos ni agua.'],['REANUDE CON AUTORIZACIÓN','Continúe la actividad solo cuando el personal que atiende el caso confirme que el área es segura.']];
const sealNames=['🐒 Mono cariblanco','🌸 Orquídea','🐆 Jaguar','🐿️ Ardilla','🔭 Binoculares'];
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(s){app.innerHTML=s;window.scrollTo(0,0)}function notice(t){let e=document.getElementById('status');if(e)e.textContent=t}function advance(){stage++;render()}
function seal(i){return `<div class="seal">${sealNames[i].split(' ')[0]}<small>${sealNames[i].split(' ').slice(1).join(' ')}</small></div>`}
function success(i){show(`<h2>¡Estación superada!</h2><p>Has ganado tu sello:</p>${seal(i)}<p>Continúa tu recorrido por la biodiversidad.</p><button onclick="advance()">Siguiente estación →</button>`)}
function render(){if(stage===0){show(`<h2>Bienvenido a la aventura</h2><p>Recorre seis estaciones, aprende sobre la biodiversidad de Colombia y colecciona cinco sellos.</p><label>Nombre completo<input id="nm" maxlength="100" autocomplete="name" placeholder="Escribe tu nombre"></label><label>Empresa<input id="co" maxlength="100" placeholder="Empresa donde trabajas"></label><p class="muted">Tus datos se registrarán al finalizar si se configura el servicio de recepción.</p><button onclick="start()">Comenzar aventura →</button><p id="status" class="error"></p>`);return}
if(stage===1){show(`<h2>Estación 1 · Encuentra las especies</h2><p>Busca y toca las tres especies escondidas en la selva.</p><div class="scene" aria-label="Bosque tropical con tres animales"><button class="target ${found.has(0)?'found':''}" style="left:20%;top:17%" onclick="findAnimal(0)" aria-label="Mono cariblanco"></button><button class="target ${found.has(1)?'found':''}" style="left:70%;top:22%" onclick="findAnimal(1)" aria-label="Momotus subrufescens"></button><button class="target ${found.has(2)?'found':''}" style="left:71%;top:70%" onclick="findAnimal(2)" aria-label="Gonatodes albogularis"></button></div><div class="targets">${['Cebus versicolor','Momotus subrufescens','Gonatodes albogularis'].map((n,i)=>`<span class="pill ${found.has(i)?'done':''}">${found.has(i)?'✓ ':''}${n}</span>`).join('')}</div><p id="status">Encontradas: ${found.size} de 3</p>`);return}
if(stage===2){show(`<h2>Estación 2 · Trivia de biodiversidad</h2><p>Responde correctamente las cinco preguntas para obtener el sello de orquídea.</p>${q.map((item,i)=>`<div class="question"><strong>${i+1}. ${item[0]}</strong>${item[1].map((a,j)=>`<button class="choice ${answers[i]===j?'selected':''}" onclick="pick(${i},${j})">${'ABCD'[j]}. ${a}</button>`).join('')}</div>`).join('')}<button onclick="checkQuiz()">Verificar respuestas</button><p id="status"></p>`);return}
if(stage===3){show(`<h2>Estación 3 · ¿De quién es la huella?</h2><p>Selecciona la especie correspondiente a cada huella. Las ilustraciones son esquemáticas y deben contrastarse con las referencias de campo.</p><div class="footprints">${[0,1,2].map(i=>`<div class="foot">${footSVG(i)}<b>Huella ${'ABC'[i]}</b><select aria-label="Identificar huella ${i+1}" onchange="footAnswers[${i}]=this.value" style="width:100%;padding:8px"><option value="">Selecciona</option>${['Panthera onca','Cerdocyon thous','Eira barbara'].map((x,j)=>`<option value="${j}" ${footAnswers[i]==j?'selected':''}>${x}</option>`).join('')}</select></div>`).join('')}</div><button onclick="checkFoot()">Verificar huellas</button><p id="status"></p>`);return}
if(stage===4){show(`<h2>Estación 4 · Encuentro con fauna</h2><p>Ordena las recomendaciones del 1 al 5 utilizando las flechas.</p>${order.map((id,i)=>`<div class="step"><strong>${i+1}. ${steps[id-1][0]}</strong><p>${steps[id-1][1]}</p><button class="secondary" onclick="move(${i},-1)" ${i===0?'disabled':''}>↑ Subir</button><button class="secondary" onclick="move(${i},1)" ${i===4?'disabled':''}>↓ Bajar</button></div>`).join('')}<div class="notice"><b>Recuerde:</b> Una foto desde una distancia segura y la ubicación del hallazgo pueden ayudar a la atención.</div><button onclick="checkOrder()">Verificar orden</button><p id="status"></p>`);return}
if(stage===5){let e=[['Silla','🪑'],['Binoculares','equipo_binoculares.jpg'],['GPS','equipo_gps.jpg'],['Cámara','equipo_camara.jpg'],['Libreta','equipo_libreta.jpg'],['Oso de peluche','🧸'],['Brocha','🖌️'],['Pelota','⚽']];show(`<h2>Estación 5 · Equipos de monitoreo</h2><p>Selecciona los cuatro objetos que utilizarías en el monitoreo de fauna y flora.</p><div class="equipment">${e.map((x,i)=>`<button class="equip ${selectedEquip.has(i)?'on':''}" onclick="toggleEquip(${i})">${x[1].endsWith('.jpg')?`<img src="${x[1]}" alt="${x[0]}">`:`<div style="font-size:70px">${x[1]}</div>`}<strong>${x[0]}</strong>${selectedEquip.has(i)?' ✓':''}</button>`).join('')}</div><button onclick="checkEquip()">Verificar selección</button><p id="status"></p>`);return}
if(stage===6){show(`<div class="certificate" id="cert"><h2>🌿 CERTIFICADO</h2><h3>Compromiso con la biodiversidad</h3><p>Se reconoce a</p><h2>${escapeHTML(name)}</h2><p>${escapeHTML(company)}</p><p>por completar las cinco estaciones del Pasaporte de la Biodiversidad.</p><h3>Mi compromiso</h3><p>Me comprometo a respetar la fauna y la flora silvestres en cada lugar donde realice mis actividades. Mantendré una distancia segura de los animales, no los alimentaré ni manipularé y cuidaré sus hábitats.</p><p>Antes de intervenir un área, estaré atento a la presencia de seres vivos. Si encuentro un animal silvestre, detendré la actividad en el punto, protegeré el lugar y avisaré al ambiental de campo para que se active la atención correspondiente.</p><p><strong>Cada acción cuenta. Hoy me comprometo a proteger la vida en todas sus formas.</strong></p><p><b>Fecha:</b> ${escapeHTML(date)}</p><h3>Mis cinco sellos</h3><div class="seals">${[0,1,2,3,4].map(seal).join('')}</div></div><div class="no-print"><p class="notice">¡Felicitaciones! Guarda tu certificado usando la opción Imprimir / Guardar como PDF de tu celular.</p><button onclick="window.print()">Guardar certificado / Imprimir</button><button class="secondary" onclick="downloadCSV()">Descargar constancia CSV</button><p id="status"></p></div>`);register();return}}
function start(){name=document.getElementById('nm').value.trim();company=document.getElementById('co').value.trim();if(!name||!company){notice('Completa tu nombre y empresa.');return}date=new Date().toLocaleDateString('es-CO',{year:'numeric',month:'long',day:'numeric'});advance()}
function findAnimal(i){found.add(i);if(found.size===3)success(0);else render()}
function pick(i,j){answers[i]=j;render()}
function checkQuiz(){let bad=q.map((x,i)=>answers[i]===x[2]).filter(x=>!x).length;if(!bad)success(1);else notice(`Revisa ${bad} respuesta(s) y vuelve a intentarlo.`)}
function footSVG(i){let toes=i===2?5:4;let angles=Array.from({length:toes},(_,j)=>{let x=22+j*15+(i===2?0:7);let y=25+Math.abs((toes-1)/2-j)*6;return `<ellipse cx="${x}" cy="${y}" rx="7" ry="10" fill="#6c4932"/>`}).join('');return `<svg viewBox="0 0 110 130" role="img" aria-label="Ilustración esquemática de huella"><rect width="110" height="130" fill="#e8d6bd" rx="12"/>${toes===5?'<ellipse cx="54" cy="86" rx="38" ry="23" fill="#6c4932"/>':'<path d="M25 78 Q32 48 55 55 Q82 50 86 80 Q80 107 55 101 Q30 108 25 78" fill="#6c4932"/>'}${toes===5?'<ellipse cx="20" cy="72" rx="10" ry="15" fill="#6c4932"/>':''}${angles}</svg>`}
function checkFoot(){if([0,1,2].every(i=>Number(footAnswers[i])===i&&footAnswers[i]!==undefined))success(2);else notice('Hay identificaciones por revisar. Intenta nuevamente.')}
function move(i,d){let j=i+d;if(j<0||j>4)return;[order[i],order[j]]=[order[j],order[i]];render()}
function checkOrder(){if(order.every((x,i)=>x===i+1))success(3);else notice('El orden aún no es correcto. Revisa la secuencia.')}
function toggleEquip(i){selectedEquip.has(i)?selectedEquip.delete(i):selectedEquip.add(i);render()}
function checkEquip(){if(selectedEquip.size===4&&[1,2,3,4].every(i=>selectedEquip.has(i)))success(4);else notice('Selecciona exactamente los cuatro equipos adecuados.')}
function downloadCSV(){let row=['Nombre','Empresa','Fecha','Estado','Sellos'].map(x=>'"'+x+'"').join(',')+'\r\n'+[name,company,date,'Certificado',sealNames.join('; ')].map(x=>'"'+x.replaceAll('"','""')+'"').join(',');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+row],{type:'text/csv;charset=utf-8'}));a.download='certificado_'+name.replace(/[^a-z0-9]/gi,'_')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
let registered=false;function register(){if(registered)return;registered=true;if(!REGISTRO_URL){notice('Registro por correo pendiente de configuración. Puedes guardar tu certificado.');return}let data={nombre:name,empresa:company,fecha:date,estado:'Certificado',sellos:sealNames.join('; ')};try{fetch(REGISTRO_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(data)}).then(()=>notice('Registro enviado para procesamiento. La recepción debe comprobarse en la hoja de cálculo.')).catch(()=>notice('No se pudo enviar el registro. Descarga tu constancia CSV.'))}catch(e){notice('Registro no enviado. Descarga tu constancia CSV.')}}render();
</script></body></html>
